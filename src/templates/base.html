<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}保险服务平台{% endblock %}</title>
<style>
  :root {
    --brand: #3B6FD4;
    --brand-soft: #5B8DEF;
    --ink: #1f2d3d;
    --muted: #6b7a90;
    --line: #e6ecf4;
    --bg: #f6f9fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(120% 90% at 50% 0%, #eef4fd 0%, var(--bg) 60%);
    color: var(--ink);
    font: 16px/1.7 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 520px; padding: 40px 36px 32px;
    background: #fff; border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 12px 36px rgba(31, 45, 61, .08); text-align: center;
  }
  .mascot { width: 132px; height: 132px; margin: 0 auto 22px; }
  .mascot svg { width: 100%; height: 100%; display: block; }
  h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: -.02em; }
  p { margin: 0 0 14px; color: var(--muted); }
  .trace { font-size: 13px; word-break: break-all; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
  .links a {
    padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--brand); font-size: 14px; text-decoration: none;
  }
  .links a:hover { background: var(--bg); border-color: var(--brand-soft); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mascot">{{ mascot | safe }}</div>
    {% block content %}{% endblock %}
  </main>
  <footer>insurance-service v{{ version }} · 安安为你护航 🛡️</footer>
</body>
</html>
