# 保险服务平台 bee-rust 应用配置参考（字段对齐）
# 当前运行时只读取环境变量（见 README / .env.example）；本文件不参与解析，仅用于字段与缺省值参考。

[server]
host = "0.0.0.0"
port = 8080

[database]
url = "${DATABASE_URL}"

[jwt]
secret = "${JWT_SECRET}"
issuer = "${JWT_ISSUER}"
access_expiry = 7200
refresh_expiry = 604800

[crypto]
master_key = "${CRYPTO_MASTER_KEY}"

[payment]
# 支付回调校验令牌（请求头 X-Callback-Token）；留空表示禁用支付回调
callback_token = "${PAYMENT_CALLBACK_TOKEN}"

[log]
level = "info"
