[workspace]
resolver = "2"
members = ["."]            # 单 crate；后续可按需拆分 crates/
default-members = ["."]    # 测试/构建默认只针对本 crate，不含 vendor 快照

[workspace.package]
version = "1.10.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.87"
# 以下字段供 vendor/bee-rust 快照内的 crate 继承（其自身 workspace 清单在包内嵌场景下
# 会被 Cargo 视为本 workspace 的成员，故此处需与 bee-rust 1.0.6 保持一致）
repository = "https://github.com/erikwang2013/bee-rust"
description = "A production-grade web framework for Rust, inspired by Go's Beego"
keywords = ["web", "framework", "beego", "mvc", "orm"]
categories = ["web-programming"]

[workspace.dependencies]
axum = "0.8"               # 与 bee_router 对齐（bee-rust[workspace].axum）
tower = "0.5"              # 供 vendor/bee-rust 快照内的 crate 继承
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
jsonwebtoken = "9"
regex = "1"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"               # 密码哈希
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# idgen_rs：snowflake 主键生成（0.2.0 为 AtomicU64 lock-free；网络拉取失败时降级 0.1.6）
idgen_rs = "0.2"

# bee-rust（v1.0.6，vendor 快照，锁定源码保证离线可复现构建）
# 来源：bee-rust HEAD 93dd5c57cfff66f8c25a8e9a56e880278b72c287 的 git archive 快照。
# crates.io 的 1.6.x API 与本代码不兼容；GitHub git 协议在本机不可达。
# path 指向 crates/bee_rust 子 crate（仓库根为 virtual workspace manifest）。
bee_rust = { path = "vendor/bee-rust/crates/bee_rust", features = ["full"] }

# security-rust 已被 bee_rust 间接引用，此处显式声明便于直接使用 Scanner
# 注：crates.io 包名为 `security-rust`（连字符），代码中 import 为 `security_rust`（下划线）
security-rust = "1"

# mysql_async：bee_orm 仅提供参数化 SELECT 构建（无执行层），此处补执行与事务。
# `chrono` feature 使 NaiveDateTime 实现 FromValue（DATETIME 列 → 模型时间字段）。
# registry 已有 .crate 缓存，可离线编译。
mysql_async = { version = "0.34", features = ["chrono"] }

[package]
name = "insurance-service"
version = "1.10.0"
edition = "2024"
rust-version = "1.87"
description = "保险服务平台后端（bee-rust 阶段 0 骨架）"
authors = ["erik <erik@erik.xyz>"]
license = "Apache-2.0"

# 特性说明：
# - `bee_rust` 已于 2026-09-01 激活（vendor 快照，见 [workspace.dependencies] 注释）。
# - 业务模块（models/services/providers/crypto/search/middleware）采用标准 struct + 本地
#   抽象实现，不依赖 bee_* crate，因此默认构建可完整编译。

[features]
default = []

[dependencies]
axum = { workspace = true }
bee_rust = { workspace = true }
security-rust = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
jsonwebtoken = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
mysql_async = { workspace = true }
idgen_rs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = "0.5"
