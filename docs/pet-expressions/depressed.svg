<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="霜霜 · 沮丧 Depressed"><title>霜霜 · 沮丧 Depressed</title><desc>霜霜 的 沮丧 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-slump 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
