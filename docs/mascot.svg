<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="霜霜，insurance-service 吉祥物——雪豹幼崽，尾尖是一片雪花结晶，怀里抱着统一信封">
  <title>霜霜 · insurance-service 吉祥物（雪豹幼崽）</title>
  <defs>
    <!-- 冰面底盘：冷蓝渐变，与吉祥物安安同色系 -->
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9BF5"/>
      <stop offset="1" stop-color="#3B6FD4"/>
    </linearGradient>
    <!-- 毛色：userSpaceOnUse，让头 / 身 / 尾 / 爪共用同一套渐变，接缝不露 -->
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="120" y1="96" x2="280" y2="384">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFB"/>
    </linearGradient>
    <!-- 火漆：沿用旧版围巾的橙，全图唯一暖色 -->
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A44"/>
      <stop offset="1" stop-color="#E8721F"/>
    </linearGradient>
    <!-- 雪花的一条臂（锥形，带两枚分叉）：rotate 三份即成六瓣结晶 -->
    <g id="sfArm" fill="#FFFFFF">
      <path d="M316 190 L309 186 L316 134 L323 186 Z"/>
      <path d="M316 158 L303 147 L311 161 Z"/>
      <path d="M316 158 L329 147 L321 161 Z"/>
    </g>
  </defs>

  <!-- ===== 冰面底盘 ===== -->
  <circle cx="200" cy="200" r="188" fill="url(#ice)"/>
  <circle cx="200" cy="200" r="150" fill="#FFFFFF" opacity="0.06"/>
  <!-- 冰晶切面与高光 -->
  <path d="M200 30 L347 115 L347 285 L200 370 L53 285 L53 115 Z" fill="#FFFFFF" opacity="0.05"/>
  <path d="M200 200 L347 115 L347 285 Z" fill="#FFFFFF" opacity="0.04"/>
  <path d="M92 88 A150 150 0 0 1 188 52" stroke="#FFFFFF" stroke-width="9" fill="none"
        opacity="0.16" stroke-linecap="round"/>

  <!-- 空气中的碎雪与冰棱 -->
  <g fill="#FFFFFF" opacity="0.26">
    <circle cx="96" cy="122" r="4.5"/>
    <circle cx="314" cy="106" r="3.5"/>
    <circle cx="288" cy="336" r="4"/>
    <circle cx="112" cy="300" r="3"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <path d="M84 236 Q86 246 96 248 Q86 250 84 260 Q82 250 72 248 Q82 246 84 236 Z"/>
    <path d="M116 152 Q117 158 123 159 Q117 160 116 166 Q115 160 109 159 Q115 158 116 152 Z"/>
  </g>

  <!-- ===== 尾巴（先画，被身体压住根部；尾尖收细后"长出"雪花） ===== -->
  <path d="M268 322 Q320 314 330 264 Q334 246 330 232" stroke="url(#fur)" stroke-width="32"
        fill="none" stroke-linecap="round"/>
  <path d="M272 326 Q314 314 324 268 Q326 254 324 244" stroke="url(#fur)" stroke-width="22"
        fill="none" stroke-linecap="round"/>
  <path d="M284 320 Q312 308 320 278" stroke="#E4EEFB" stroke-width="8" fill="none"
        stroke-linecap="round" opacity="0.85"/>
  <!-- 尾尖：一片雪花结晶（对应 snowflake 分布式主键） -->
  <circle cx="316" cy="186" r="58" fill="#FFFFFF" opacity="0.12"/>
  <g>
    <use href="#sfArm"/>
    <use href="#sfArm" transform="rotate(60 316 186)"/>
    <use href="#sfArm" transform="rotate(120 316 186)"/>
    <g transform="rotate(180 316 186)">
      <use href="#sfArm"/>
      <use href="#sfArm" transform="rotate(60 316 186)"/>
      <use href="#sfArm" transform="rotate(120 316 186)"/>
    </g>
  </g>
  <circle cx="316" cy="186" r="14" fill="#D8E8FC"/>
  <circle cx="316" cy="186" r="6.5" fill="#FFFFFF"/>
  <!-- 尾上梅花斑 -->
  <g fill="none" stroke="#A9C6EE" stroke-width="3">
    <circle cx="300" cy="294" r="5"/>
    <circle cx="328" cy="252" r="4.5"/>
  </g>

  <!-- ===== 身体（坐姿，被头压住顶部） ===== -->
  <ellipse cx="200" cy="306" rx="76" ry="68" fill="url(#fur)"/>
  <ellipse cx="200" cy="322" rx="52" ry="44" fill="#FFFFFF" opacity="0.55"/>

  <!-- 身上梅花斑（雪豹的环状斑纹） -->
  <g fill="none" stroke="#A9C6EE" stroke-width="3.4">
    <circle cx="150" cy="288" r="7"/>
    <circle cx="250" cy="294" r="6"/>
    <circle cx="132" cy="324" r="6.5"/>
    <circle cx="268" cy="328" r="5.5"/>
    <circle cx="176" cy="264" r="5"/>
    <circle cx="226" cy="266" r="5"/>
  </g>

  <!-- ===== 前肢（末端被信封盖住，成"抱着"的姿态） ===== -->
  <ellipse cx="154" cy="316" rx="21" ry="40" fill="url(#fur)" transform="rotate(16 154 316)"/>
  <ellipse cx="246" cy="316" rx="21" ry="40" fill="url(#fur)" transform="rotate(-16 246 316)"/>

  <!-- ===== 统一信封（{code, message, data}） ===== -->
  <g>
    <rect x="154" y="312" width="92" height="56" rx="6" fill="#F7FAFF" stroke="#C9D8EE" stroke-width="2"/>
    <path d="M156 315 L200 345 L244 315" fill="#E9F1FE" stroke="#C9D8EE" stroke-width="2"
          stroke-linejoin="round"/>
    <!-- 正文示意：两行"数据"，呼应统一响应信封 -->
    <rect x="166" y="352" width="30" height="4" rx="2" fill="#C9D8EE"/>
    <rect x="166" y="360" width="18" height="4" rx="2" fill="#DDE7F7"/>
    <!-- 火漆封缄：受理凭证 -->
    <circle cx="222" cy="356" r="13" fill="url(#seal)"/>
    <path d="M216 356 L220 360 L228 351" stroke="#FFFFFF" stroke-width="3" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== 后爪（压在信封下缘，抱住不撒手） ===== -->
  <ellipse cx="160" cy="370" rx="26" ry="14" fill="url(#fur)"/>
  <ellipse cx="240" cy="370" rx="26" ry="14" fill="url(#fur)"/>
  <g fill="#C9D8EE" opacity="0.75">
    <circle cx="152" cy="368" r="3"/>
    <circle cx="161" cy="366" r="3"/>
    <circle cx="170" cy="368" r="3"/>
    <circle cx="232" cy="368" r="3"/>
    <circle cx="241" cy="366" r="3"/>
    <circle cx="250" cy="368" r="3"/>
  </g>

  <!-- ===== 耳朵（先画，被头压住底边） ===== -->
  <ellipse cx="140" cy="124" rx="32" ry="28" fill="#F1F6FE"/>
  <ellipse cx="260" cy="124" rx="32" ry="28" fill="#F1F6FE"/>
  <ellipse cx="140" cy="126" rx="15" ry="12" fill="#C9DDFA"/>
  <ellipse cx="260" cy="126" rx="15" ry="12" fill="#C9DDFA"/>

  <!-- ===== 头（大头萌感） + 蓬松腮毛 ===== -->
  <ellipse cx="200" cy="186" rx="86" ry="80" fill="url(#fur)"/>
  <circle cx="120" cy="212" r="19" fill="url(#fur)"/>
  <circle cx="280" cy="212" r="19" fill="url(#fur)"/>
  <circle cx="134" cy="238" r="14" fill="url(#fur)"/>
  <circle cx="266" cy="238" r="14" fill="url(#fur)"/>

  <!-- 额前小雪花：snowflake 主键的第二处彩蛋（六瓣等长，别写成"火柴人"） -->
  <g stroke="#CFE3FB" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M200 135 V157 M190.5 140.5 L209.5 151.5 M190.5 151.5 L209.5 140.5"/>
  </g>

  <!-- ===== 眼斑（冰蓝，雪豹的标识） ===== -->
  <ellipse cx="164" cy="190" rx="25" ry="21" fill="#C9DDFA" transform="rotate(-8 164 190)"/>
  <ellipse cx="236" cy="190" rx="25" ry="21" fill="#C9DDFA" transform="rotate(8 236 190)"/>

  <!-- 眼白 -->
  <circle cx="164" cy="188" r="13.5" fill="#FFFFFF"/>
  <circle cx="236" cy="188" r="13.5" fill="#FFFFFF"/>
  <!-- 虹膜（项目主色蓝）+ 瞳孔 -->
  <circle cx="167" cy="190" r="9.5" fill="#5B8DEF"/>
  <circle cx="233" cy="190" r="9.5" fill="#5B8DEF"/>
  <circle cx="168" cy="191" r="5.5" fill="#16233A"/>
  <circle cx="232" cy="191" r="5.5" fill="#16233A"/>
  <!-- 双高光 -->
  <circle cx="163" cy="185" r="4" fill="#FFFFFF"/>
  <circle cx="172" cy="196" r="1.8" fill="#FFFFFF"/>
  <circle cx="237" cy="185" r="4" fill="#FFFFFF"/>
  <circle cx="228" cy="196" r="1.8" fill="#FFFFFF"/>

  <!-- 鼻子 -->
  <path d="M192 212 Q200 205 208 212 Q205 223 200 223 Q195 223 192 212 Z" fill="#2B3A55"/>
  <!-- 嘴（ω 微笑） -->
  <path d="M186 228 Q194 238 200 229 Q206 238 214 228" stroke="#2B3A55" stroke-width="3.6"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 胡须 -->
  <g stroke="#B7C9E6" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M166 222 L136 216"/>
    <path d="M166 230 L138 232"/>
    <path d="M234 222 L264 216"/>
    <path d="M234 230 L262 232"/>
  </g>
  <!-- 腮红（冰面上的那点血色） -->
  <ellipse cx="136" cy="214" rx="13" ry="7" fill="#FFB8C6" opacity="0.5"/>
  <ellipse cx="264" cy="214" rx="13" ry="7" fill="#FFB8C6" opacity="0.5"/>
</svg>
