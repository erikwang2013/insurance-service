<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="安安，保险服务平台吉祥物">
  <!-- 背景柔光圈 -->
  <circle cx="200" cy="200" r="176" fill="#EAF3FF"/>
  <circle cx="200" cy="200" r="150" fill="#F4F9FF"/>

  <!-- 小脚（下方两枚） -->
  <ellipse cx="168" cy="366" rx="26" ry="14" fill="#2E6FC9"/>
  <ellipse cx="232" cy="366" rx="26" ry="14" fill="#2E6FC9"/>

  <!-- 安全帽（保护伞意象：橙色的“安”，护住头顶） -->
  <path d="M160 96 Q200 28 240 96 L240 104 Q200 80 160 104 Z" fill="#FFB02E"/>
  <rect x="150" y="92" width="100" height="14" rx="7" fill="#FFA014"/>

  <!-- 小手臂 -->
  <circle cx="108" cy="225" r="15" fill="#2E6FC9"/>
  <circle cx="292" cy="225" r="15" fill="#2E6FC9"/>

  <!-- 盾牌主体（保险保障意象：盾） -->
  <path d="M200 62
           C 258 62 300 104 310 160
           L 310 242
           C 310 292 268 334 200 362
           C 132 334 90 292 90 242
           L 90 160
           C 100 104 142 62 200 62 Z"
        fill="#2E6FC9"/>

  <!-- 盾面（内侧白色，蓝色描边自然形成盾缘） -->
  <path d="M200 62
           C 258 62 300 104 310 160
           L 310 242
           C 310 292 268 334 200 362
           C 132 334 90 292 90 242
           L 90 160
           C 100 104 142 62 200 62 Z"
        transform="translate(200,200) scale(0.74) translate(-200,-200)"
        fill="#FFFFFF"/>

  <!-- 眼睛 -->
  <circle cx="166" cy="182" r="16" fill="#26293A"/>
  <circle cx="234" cy="182" r="16" fill="#26293A"/>
  <circle cx="171" cy="176" r="5.5" fill="#FFFFFF"/>
  <circle cx="239" cy="176" r="5.5" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <ellipse cx="140" cy="202" rx="16" ry="9" fill="#FFB3C1" opacity="0.85"/>
  <ellipse cx="260" cy="202" rx="16" ry="9" fill="#FFB3C1" opacity="0.85"/>

  <!-- 微笑 -->
  <path d="M185 202 Q200 218 215 202" stroke="#26293A" stroke-width="5" fill="none"
        stroke-linecap="round"/>

  <!-- 胸前爱心（保险 = 有温度的保障） -->
  <path d="M200 250
           C 200 246 178 232 178 244
           C 178 252 196 260 200 264
           C 204 260 222 252 222 244
           C 222 232 200 246 200 250 Z"
        fill="#FF6B81"/>

  <!-- 盾缘高光弧 -->
  <path d="M126 130 Q118 150 116 168" stroke="#A8CCF2" stroke-width="6" fill="none"
        stroke-linecap="round" opacity="0.8"/>
</svg>